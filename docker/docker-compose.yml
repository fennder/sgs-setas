version: '3'
services:
  web:
    build: .
    logging:
        driver: "json-file"
        options:
            max-file: "5"
            max-size: 100m
    restart: always
    environment:
      TZ: "America/Araguaina"
    ports:
      - "8080:88"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/sites-enabled/default
      - ../src:/src
      - ../arquivos:/tmp/storage/arquivos

  db:
    image: mysql:5.7.29
    restart: always
    shm_size: '1gb'
    logging:
        driver: "json-file"
        options:
            max-file: "5"
            max-size: 100m
    environment:
      MYSQL_DATABASE: sgs
      MYSQL_USER: edir
      MYSQL_PASSWORD: setas@123
      SERVICE_TAG: dev
      SERVICE_NAME: db
    volumes:
      - ../sgs-data/mysql:/var/lib/mysql
      - ../sgs-data/mysql-backup:/backup
    ports:
      - "6306:3306"
    depends_on:
      - web