services:
  php-fpm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sgs-sd-gti-setas-php-fpm
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: 100m
    restart: always
    environment:
      TZ: "America/Araguaina"
      DB_HOST: db
      DB_DATABASE: sgs
      DB_USERNAME: edir
      DB_PASSWORD: setas@123
    volumes:
      - ../src:/var/www/html
    depends_on:
      - db
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.24
    restart: always
    ports:
      - "8025:8025"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: 100m

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ../src:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm

  db:
    image: mysql:5.7.29
    restart: always
    shm_size: '1gb'
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: 100m
    environment:
      MYSQL_DATABASE: sgs
      MYSQL_USER: edir
      MYSQL_PASSWORD: setas@123
      MYSQL_ROOT_PASSWORD: setas@123
      SERVICE_TAG: dev
      SERVICE_NAME: db
    volumes:
      - ../sgs-data/mysql-backup:/var/lib/mysql
    ports:
      - "6306:3306"
