version: '3'
services:
  web:
    build: .
    logging:
        driver: "json-file"
        options:
            max-file: "5"
            max-size: 100m
    restart: always
    environment:
      TZ: "America/Araguaina"
    ports:
      - 8000:80
    volumes:
      - ./nginx.conf:/etc/nginx/sites-enabled/default
      - ./src:/src
      - ../sgs-sd-gti-setas:/tmp/storage/sgs-sd-gti-setas
      # - ../central3/data-web:/tmp/storage/c3

  db:
    image: mysql:10.4
    restart: always
    shm_size: '1gb'
    logging:
        driver: "json-file"
        options:
            max-file: "5"
            max-size: 100m
    environment:
      MYSQL_DB: sgs
      MYSQL_USER: root
      MYSQL_PASSWORD: eps9001
    volumes:
      - ../sgs-data/mysql:/var/lib/mysql/data
      - ../sgs-data/mysql-backup:/backup
    ports:
      - "3306:3306"

